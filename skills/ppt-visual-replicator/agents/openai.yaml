interface:
  display_name: "PPT Visual Replicator"
  short_description: "Quickly redraw a PPTX as an editable presentation"
  default_prompt: "Use $ppt-visual-replicator to recreate this target PPTX through original-page screenshot → built-in imagegen redraw → PNG → editable PPTX. Work locally one page at a time, preserve all content, and return only the final editable deck."
